name: JARVIS Windows and Android Build

on:
  workflow_dispatch:
  push:
    branches: [feature/gemini-windows-android]
    paths:
      - 'JARVIS_HOST/**'
      - 'JARVIS_ANDROID/**'
      - '.github/workflows/jarvis-cross-platform.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p JARVIS_ANDROID assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Stagepulse-JARVIS-Android-APK
          path: JARVIS_ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: JARVIS_HOST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt
      - name: Check Python syntax
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.py | ForEach-Object { python -m py_compile $_.FullName }
      - name: Build EXE bundle
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name StagepulseJARVIS --collect-all customtkinter --collect-all pystray --collect-all PIL --hidden-import=win32timezone main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Stagepulse-JARVIS-Windows-EXE
          path: JARVIS_HOST/dist/StagepulseJARVIS/
          if-no-files-found: error
