name: JARVIS Windows Single-EXE Build

on:
  push:
    branches: [ main ]
    paths:
      - 'JARVIS_HOST/**'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build StagepulseJARVIS.exe
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: JARVIS_HOST/requirements.txt

      - name: Install host dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r JARVIS_HOST/requirements.txt pyinstaller

      - name: Audit Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip-audit
          if ($LASTEXITCODE -ne 0) { throw "pip-audit installation failed" }
          pip-audit -r JARVIS_HOST/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Python dependency audit reported vulnerabilities" }

      - name: Check Python syntax
        shell: pwsh
        run: |
          python -m py_compile JARVIS_HOST/main.py JARVIS_HOST/core/ai_brain.py JARVIS_HOST/core/command_processor.py JARVIS_HOST/core/jarvis.py JARVIS_HOST/core/software_scout.py JARVIS_HOST/core/translation_manager.py JARVIS_HOST/core/engineering_task_runtime.py JARVIS_HOST/core/update_manager.py JARVIS_HOST/gui/main_window.py JARVIS_HOST/modules/file_manager.py JARVIS_HOST/voice/text_to_speech.py JARVIS_HOST/voice/speech_recognition.py JARVIS_HOST/voice/wake_word.py JARVIS_HOST/voice/vosk_model_manager.py JARVIS_HOST/android_bridge.py
          if ($LASTEXITCODE -ne 0) { throw "Python syntax check failed" }

      - name: Verify expert workspace is wired into the desktop GUI
        shell: pwsh
        run: |
          python -c "from pathlib import Path; s=Path('JARVIS_HOST/gui/main_window.py').read_text(encoding='utf-8'); assert 'UZMANLAR' in s and '_open_experts' in s; print('Expert workspace verified')"
          if ($LASTEXITCODE -ne 0) { throw "Expert workspace check failed" }

      - name: Run AI provider regression tests
        shell: pwsh
        working-directory: JARVIS_HOST
        run: |
          python -m pytest tests -q
          if ($LASTEXITCODE -ne 0) { throw "JARVIS regression tests failed" }

      - name: Build single-file Windows EXE
        shell: pwsh
        working-directory: JARVIS_HOST
        run: |
          python build_jarvis_exe.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build script failed" }
          $exe = "dist/StagepulseJARVIS.exe"
          if (!(Test-Path $exe)) { throw "Single-file EXE was not created" }
          $size = (Get-Item $exe).Length
          if ($size -lt 1000000) { throw "EXE looks invalid; file size is only $size bytes" }
          Write-Host "Verified $exe ($size bytes)"

      - name: Upload single-file EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: StagepulseJARVIS-Windows-x64-EXE
          path: JARVIS_HOST/dist/StagepulseJARVIS.exe
          if-no-files-found: error
          retention-days: 14
