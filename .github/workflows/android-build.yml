name: JARVIS Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JARVIS Python syntax and website/update helpers
        shell: bash
        run: |
          python -m pip install --quiet requests
          python -m py_compile JARVIS_HOST/core/ai_brain.py JARVIS_HOST/core/command_processor.py JARVIS_HOST/core/jarvis.py JARVIS_HOST/core/update_manager.py JARVIS_HOST/gui/main_window.py JARVIS_HOST/voice/text_to_speech.py JARVIS_HOST/voice/speech_recognition.py
          python - <<'PY'
          import ast
          import re
          import unicodedata

          path = "JARVIS_HOST/core/command_processor.py"
          with open(path, encoding="utf-8") as source_file:
              tree = ast.parse(source_file.read(), filename=path)
          names = {"_normalize_direct_command", "_resolve_direct_website"}
          nodes = [node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name in names]
          assert len(nodes) == 2, "Website route helpers were not found"
          namespace = {"re": re, "unicodedata": unicodedata}
          module = ast.Module(body=nodes, type_ignores=[])
          exec(compile(module, path, "exec"), namespace)
          resolve = namespace["_resolve_direct_website"]
          cases = [
              ("Stagepulse.com.tr aç", "https://stagepulse.com.tr/"),
              ("benim sitemi aç", "https://stagepulse.com.tr/admin/"),
              ("admin panelini aç", "https://stagepulse.com.tr/admin/"),
              ("personel aç", "https://stagepulse.com.tr/portal/"),
              ("personel sayfasını aç", "https://stagepulse.com.tr/portal/"),
              ("siteyi aç", "https://stagepulse.com.tr/"),
              ("Facebook aç", "https://www.facebook.com/"),
              ("yalnızca site hakkında konuş", None),
          ]
          for command, expected in cases:
              result = resolve(command)
              actual = result[0] if result else None
              assert actual == expected, f"{command!r}: expected {expected!r}, got {actual!r}"
          print("JARVIS website route aliases: PASS")
          PY
          python - <<'PY'
          import importlib.util
          import sys
          spec = importlib.util.spec_from_file_location(
              "jarvis_update_manager_ci", "JARVIS_HOST/core/update_manager.py"
          )
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          version = module.WindowsUpdateManager._version_tuple
          trusted = module.WindowsUpdateManager._trusted_release_url
          assert version("2.2.2-piper") == (2, 2, 2)
          assert version("2.3.0") > version("2.2.2-piper")
          assert trusted("https://github.com/ibrahimFOH/JARVIS-Android/releases/download/v2.3.0/JARVIS-Windows.zip")
          assert not trusted("https://example.com/JARVIS-Windows.zip")
          assert not trusted("http://github.com/ibrahimFOH/JARVIS-Android/releases/download/v2.3.0/JARVIS-Windows.zip")
          print("JARVIS Windows updater URL/version checks: PASS")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android native build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify visible Android text-send button
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("JARVIS_ANDROID/app/src/main/java/com/stagepulse/jarvis/MainActivity.java").read_text(encoding="utf-8")
          checks = {
              "visible Turkish send button": 'textSendButton=button("GÖNDER")',
              "button sends typed text": 'textSendButton.setOnClickListener(v->sendCommand(command.getText().toString()))',
              "keyboard send action": 'command.setImeOptions(EditorInfo.IME_ACTION_SEND|EditorInfo.IME_FLAG_NO_EXTRACT_UI)',
              "empty input feedback": 'Önce gönderilecek metni yaz.',
              "button re-enabled after response": 'if(textSendButton!=null)textSendButton.setEnabled(true);',
              "PDF open button": 'openPdf.setOnClickListener(v->openPdf())',
              "chat PDF export button": 'savePdf.setOnClickListener(v->exportChatPdf())',
              "clear chat button": 'clear.setOnClickListener(v->{',
              "system TTS used directly without Piper startup": 'initSystemTtsFallback();',
          }
          bridge = Path("JARVIS_ANDROID/app/src/main/java/com/stagepulse/jarvis/BridgeClient.java").read_text(encoding="utf-8")
          bridge_checks = {
              "cleartext bridge restricted to private IPv4": "private static boolean isPrivateIpv4(String host)",
              "host URL validated on command calls": "String base = validateBaseUrl(baseUrl);",
              "redirect forwarding is disabled": "c.setInstanceFollowRedirects(false);",
              "redirect responses rejected before parsing": "Windows bridge yönlendirme yanıtı reddedildi",
          }
          for label, snippet in bridge_checks.items():
              assert snippet in bridge, "Missing Android bridge security behavior: " + label
          assert bridge.count("c.setInstanceFollowRedirects(false);") >= 2, "Redirect checks must cover both command and health endpoints"

          updater = Path("JARVIS_ANDROID/app/src/main/java/com/stagepulse/jarvis/UpdateManager.java").read_text(encoding="utf-8")
          updater_checks = {
              "manifest tag matches the current release": '!tagName.equals(json.optString("tagName", ""))',
              "APK asset is bound to the release tag": "isTrustedReleaseAsset(apkUrl, tagName)",
              "manifest URL is bound to the release tag": "isTrustedReleaseAsset(metadataUrl, tagName)",
              "redirect target is validated": "validateFinalUrl(connection.getURL())",
              "download redirect host allowlist": 'host.endsWith(".githubusercontent.com")',
          }
          for label, snippet in updater_checks.items():
              assert snippet in updater, "Missing Android updater security behavior: " + label

          permission = "if(granted && resume){"
          assert permission in source and "private boolean pendingListenPermission = false;" in source, "Missing voice permission resume state"
          for label, snippet in checks.items():
              assert snippet in source, "Missing Android text-send behavior: " + label
          for label, snippet in {
              "PDF opener": "private void openPdf()",
              "chat PDF writer": "private void writeChatPdf(Uri destination)",
              "fixed-height input row": "new LinearLayout.LayoutParams(0,54,1f)",
              "scrollable bottom action bar": "HorizontalScrollView actionScroller",
              "system TTS startup without Piper": "initSystemTtsFallback();",
          }.items():
              assert snippet in source, "Missing Android UI/voice behavior: " + label
          assert "Piper başlatılamadı" not in source, "Legacy Piper startup error still appears in the Android UI"
          print("Android text-send, bottom controls, PDF, and system TTS checks: PASS")
          PY

      - name: Build debug APK
        run: gradle -p JARVIS_ANDROID assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-PIPER-debug
          path: JARVIS_ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
