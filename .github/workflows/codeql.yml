name: JARVIS CodeQL güvenlik analizi

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, java-kotlin, cpp, javascript-typescript, actions]
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: CodeQL başlat
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: ${{ (matrix.language == 'java-kotlin' || matrix.language == 'cpp') && 'manual' || 'none' }}

      - name: JDK 17 kur
        if: matrix.language == 'java-kotlin' || matrix.language == 'cpp'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK hazırla
        if: matrix.language == 'java-kotlin' || matrix.language == 'cpp'
        uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520

      - name: Android SDK ve NDK paketlerini kur
        if: matrix.language == 'java-kotlin' || matrix.language == 'cpp'
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle 8.9 kur
        if: matrix.language == 'java-kotlin' || matrix.language == 'cpp'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'

      - name: Android Java/Kotlin ve native C++ kodunu derle
        if: matrix.language == 'java-kotlin' || matrix.language == 'cpp'
        run: gradle -p JARVIS_ANDROID assembleDebug --no-daemon

      - name: CodeQL analizini tamamla
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          category: "/language:${{ matrix.language }}"
