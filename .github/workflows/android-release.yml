name: JARVIS Android Signed Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag and required signing secrets
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_SIGNING_KEYSTORE_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret: $name. Create a stable Android release keystore and add the four ANDROID_SIGNING_* repository secrets before tagging a release."
              exit 1
            fi
          done
          VERSION_NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" JARVIS_ANDROID/app/build.gradle | head -n1)"
          if [[ -z "$VERSION_NAME" || "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]]; then
            echo "::error::Release tag must exactly match the app version: expected v$VERSION_NAME, received $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android native build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android signing key
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/jarvis-release.jks"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "JARVIS_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "JARVIS_KEYSTORE_PASSWORD=$ANDROID_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "JARVIS_KEY_ALIAS=$ANDROID_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "JARVIS_KEY_PASSWORD=$ANDROID_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle -p JARVIS_ANDROID assembleRelease --no-daemon

      - name: Prepare update metadata and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="JARVIS_ANDROID/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_SOURCE"
          cp "$APK_SOURCE" JARVIS-Android-release.apk
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' JARVIS_ANDROID/app/build.gradle | head -n1)"
          VERSION_NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" JARVIS_ANDROID/app/build.gradle | head -n1)"
          APK_SHA256="$(sha256sum JARVIS-Android-release.apk | awk '{print $1}')"
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/JARVIS-Android-release.apk"
          python - "$VERSION_CODE" "$VERSION_NAME" "$APK_SHA256" "$APK_URL" "$GITHUB_REF_NAME" <<'PY'
          import json
          import sys
          version_code, version_name, sha256, apk_url, tag = sys.argv[1:]
          payload = {
              "packageName": "com.stagepulse.jarvis",
              "versionCode": int(version_code),
              "versionName": version_name,
              "sha256": sha256,
              "apkUrl": apk_url,
              "tagName": tag,
              "notes": "Stagepulse JARVIS Android güncellemesi. İndirme SHA-256 ile doğrulanır; kurulum Android onayı gerektirir."
          }
          with open("update.json", "w", encoding="utf-8") as out:
              json.dump(payload, out, ensure_ascii=False, indent=2)
          PY
          sha256sum JARVIS-Android-release.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: JARVIS Android ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            JARVIS-Android-release.apk
            update.json
            SHA256SUMS.txt
