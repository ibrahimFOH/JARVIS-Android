name: JARVIS Signed Desktop and Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Android tag and signing secrets
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_SIGNING_KEYSTORE_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret: $name. Configure a permanent Android signing keystore and all ANDROID_SIGNING_* secrets before tagging a release."
              exit 1
            fi
          done
          VERSION_NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\\1/p" JARVIS_ANDROID/app/build.gradle | head -n1)"
          if [[ -z "$VERSION_NAME" || "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]]; then
            echo "::error::Tag must match Android VERSION_NAME. Expected v$VERSION_NAME, got $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android native build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android signing key
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/jarvis-release.jks"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "JARVIS_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "JARVIS_KEYSTORE_PASSWORD=$ANDROID_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "JARVIS_KEY_ALIAS=$ANDROID_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "JARVIS_KEY_PASSWORD=$ANDROID_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle -p JARVIS_ANDROID assembleRelease --no-daemon

      - name: Validate signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK="JARVIS_ANDROID/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p release-assets
          cp "$APK" release-assets/JARVIS-Android-release.apk

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-assets/JARVIS-Android-release.apk
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows single-file JARVIS package
    runs-on: windows-latest
    outputs:
      windows_version: ${{ steps.set-version.outputs.windows_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: JARVIS_HOST/requirements.txt

      - name: Set embedded Windows version
        id: set-version
        shell: pwsh
        run: |
          $day = Get-Date -Format 'yyyy.MM.dd'
          $version = "$day.${{ github.run_id }}"
          Set-Content -Path "JARVIS_HOST/VERSION" -Value $version -NoNewline -Encoding utf8
          Set-Content -Path "JARVIS_HOST/version.py" -Value "__version__ = `"$version`"" -Encoding utf8
          "windows_version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Windows host dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -r JARVIS_HOST/requirements.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "dependency install failed" }

      - name: Compile sources and run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "JARVIS_HOST"
          python -m compileall -q JARVIS_HOST
          if ($LASTEXITCODE -ne 0) { throw "Python compile check failed" }
          python -m pytest JARVIS_HOST/tests -q
          if ($LASTEXITCODE -ne 0) { throw "JARVIS test suite failed" }

      - name: Build and archive the single-file Windows EXE
        shell: pwsh
        run: |
          python JARVIS_HOST/build_jarvis_exe.py
          if ($LASTEXITCODE -ne 0) { throw "Single-file EXE build failed" }
          $exe = "JARVIS_HOST/dist/StagepulseJARVIS.exe"
          if (!(Test-Path $exe)) { throw "Single-file Windows EXE was not created" }
          if ((Get-Item $exe).Length -lt 1000000) { throw "EXE is unexpectedly small" }
          $package = "JARVIS_HOST/release-package"
          if (Test-Path $package) { Remove-Item $package -Recurse -Force }
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item $exe "$package/StagepulseJARVIS.exe"
          Copy-Item "JARVIS_HOST/VERSION" "$package/VERSION"
          Compress-Archive -Path "$package/*" -DestinationPath "$env:GITHUB_WORKSPACE/JARVIS-Windows.zip" -CompressionLevel Optimal -Force
          Copy-Item $exe "$env:GITHUB_WORKSPACE/StagepulseJARVIS.exe"
          if (!(Test-Path "$env:GITHUB_WORKSPACE/JARVIS-Windows.zip")) { throw "Windows ZIP package was not created" }

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            JARVIS-Windows.zip
            StagepulseJARVIS.exe
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish update manifest and shared GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets

      - name: Create update manifest and checksums
        shell: bash
        env:
          WINDOWS_VERSION: ${{ needs.build-windows.outputs.windows_version }}
        run: |
          set -euo pipefail
          test -s release-assets/JARVIS-Android-release.apk
          test -s release-assets/JARVIS-Windows.zip
          test -s release-assets/StagepulseJARVIS.exe
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\\1/p' JARVIS_ANDROID/app/build.gradle | head -n1)"
          VERSION_NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\\1/p" JARVIS_ANDROID/app/build.gradle | head -n1)"
          APK_SHA256="$(sha256sum release-assets/JARVIS-Android-release.apk | awk '{print $1}')"
          WINDOWS_SHA256="$(sha256sum release-assets/JARVIS-Windows.zip | awk '{print $1}')"
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/JARVIS-Android-release.apk"
          WINDOWS_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/JARVIS-Windows.zip"
          python - "$VERSION_CODE" "$VERSION_NAME" "$APK_SHA256" "$APK_URL" "$WINDOWS_SHA256" "$WINDOWS_URL" "$GITHUB_REF_NAME" "$WINDOWS_VERSION" <<'PY'
          import json
          import sys
          version_code, version_name, apk_sha, apk_url, win_sha, win_url, tag, windows_version = sys.argv[1:]
          payload = {
              "packageName": "com.stagepulse.jarvis",
              "versionCode": int(version_code),
              "versionName": version_name,
              "androidVersionName": version_name,
              "windowsVersionName": windows_version,
              "sha256": apk_sha,
              "apkUrl": apk_url,
              "windowsUrl": win_url,
              "windowsSha256": win_sha,
              "windowsPackageName": "StagepulseJARVIS",
              "tagName": tag,
              "notes": "Stagepulse JARVIS güncellemesi. APK ve Windows paketi SHA-256 ile doğrulanır."
          }
          with open("release-assets/update.json", "w", encoding="utf-8") as out:
              json.dump(payload, out, ensure_ascii=False, indent=2)
          PY
          (cd release-assets && sha256sum JARVIS-Android-release.apk JARVIS-Windows.zip StagepulseJARVIS.exe > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: JARVIS ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release-assets/JARVIS-Android-release.apk
            release-assets/JARVIS-Windows.zip
            release-assets/StagepulseJARVIS.exe
            release-assets/update.json
            release-assets/SHA256SUMS.txt
