name: JARVIS Signed Desktop and Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release tag and signing secrets
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_SIGNING_KEYSTORE_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret: $name. Generate a permanent Android release keystore and configure all four ANDROID_SIGNING_* repository secrets before creating a version tag."
              exit 1
            fi
          done
          VERSION_NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\\1/p" JARVIS_ANDROID/app/build.gradle | head -n1)"
          if [[ -z "$VERSION_NAME" || "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]]; then
            echo "::error::Tag must match Android VERSION_NAME and JARVIS_HOST/VERSION. Expected v$VERSION_NAME, got $GITHUB_REF_NAME."
            exit 1
          fi
          WINDOWS_VERSION="$(tr -d '\r\n' < JARVIS_HOST/VERSION)"
          if [[ "$VERSION_NAME" != "$WINDOWS_VERSION" ]]; then
            echo "::error::Android and Windows versions differ: $VERSION_NAME vs $WINDOWS_VERSION."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android native build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android signing key
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/jarvis-release.jks"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "JARVIS_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "JARVIS_KEYSTORE_PASSWORD=$ANDROID_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "JARVIS_KEY_ALIAS=$ANDROID_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "JARVIS_KEY_PASSWORD=$ANDROID_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle -p JARVIS_ANDROID assembleRelease --no-daemon

      - name: Validate signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK="JARVIS_ANDROID/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          jarsigner -verify "$APK"
          mkdir -p release-assets
          cp "$APK" release-assets/JARVIS-Android-release.apk

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-assets/JARVIS-Android-release.apk
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows JARVIS package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Windows release version
        shell: pwsh
        run: |
          $version = (Get-Content "JARVIS_HOST/VERSION" -Raw).Trim()
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Release tag must be $expected, got $env:GITHUB_REF_NAME"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: JARVIS_HOST/requirements.txt

      - name: Install Windows host dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r JARVIS_HOST/requirements.txt pyinstaller

      - name: Build Windows JARVIS
        shell: pwsh
        working-directory: JARVIS_HOST
        run: |
          python -m PyInstaller --noconfirm --clean --name JARVIS --onedir --contents-directory . --windowed --add-data "config\config.example.json;config" --add-data "VERSION;." --collect-all customtkinter --collect-all pystray --collect-all pyttsx3 --collect-all speech_recognition --collect-all pvporcupine --hidden-import win32timezone main.py
          if (!(Test-Path "dist\JARVIS\JARVIS.exe")) { throw "PyInstaller did not create dist\JARVIS\JARVIS.exe" }
          if (!(Test-Path "dist\JARVIS\VERSION")) { throw "VERSION was not included in the release package" }
          Compress-Archive -Path "dist\JARVIS\*" -DestinationPath "$env:GITHUB_WORKSPACE\JARVIS-Windows.zip" -CompressionLevel Optimal -Force
          if (!(Test-Path "$env:GITHUB_WORKSPACE\JARVIS-Windows.zip")) { throw "Windows ZIP package was not created" }

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: JARVIS-Windows.zip
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish one shared release manifest
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets

      - name: Create update manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/JARVIS-Android-release.apk
          test -s release-assets/JARVIS-Windows.zip
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\\1/p' JARVIS_ANDROID/app/build.gradle | head -n1)"
          VERSION_NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\\1/p" JARVIS_ANDROID/app/build.gradle | head -n1)"
          APK_SHA256="$(sha256sum release-assets/JARVIS-Android-release.apk | awk '{print $1}')"
          WINDOWS_SHA256="$(sha256sum release-assets/JARVIS-Windows.zip | awk '{print $1}')"
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/JARVIS-Android-release.apk"
          WINDOWS_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/JARVIS-Windows.zip"
          python - "$VERSION_CODE" "$VERSION_NAME" "$APK_SHA256" "$APK_URL" "$WINDOWS_SHA256" "$WINDOWS_URL" "$GITHUB_REF_NAME" <<'PY'
          import json
          import sys
          version_code, version_name, apk_sha, apk_url, win_sha, win_url, tag = sys.argv[1:]
          payload = {
              "packageName": "com.stagepulse.jarvis",
              "versionCode": int(version_code),
              "versionName": version_name,
              "sha256": apk_sha,
              "apkUrl": apk_url,
              "windowsUrl": win_url,
              "windowsSha256": win_sha,
              "windowsPackageName": "JARVIS-Windows",
              "tagName": tag,
              "notes": "Stagepulse JARVIS güncellemesi. APK ve Windows paketi SHA-256 ile doğrulanır. Android kurulumu kullanıcı onayı gerektirir; Windows güncellemesi mevcut ayarları ve köprü token'ını korur."
          }
          with open("release-assets/update.json", "w", encoding="utf-8") as out:
              json.dump(payload, out, ensure_ascii=False, indent=2)
          PY
          (cd release-assets && sha256sum JARVIS-Android-release.apk JARVIS-Windows.zip > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: JARVIS ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release-assets/JARVIS-Android-release.apk
            release-assets/JARVIS-Windows.zip
            release-assets/update.json
            release-assets/SHA256SUMS.txt
