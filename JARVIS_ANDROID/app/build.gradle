plugins { id 'com.android.application' }

import java.net.URL
import java.security.MessageDigest

android {
    namespace 'com.stagepulse.jarvis'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.stagepulse.jarvis'
        minSdk 26
        targetSdk 35
        versionCode 220
        versionName '2.2.0-piper'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.18.0'
}

def downloadFile = { String sourceUrl, File destination ->
    if (destination.exists() && destination.length() > 1024) return
    destination.parentFile.mkdirs()
    logger.lifecycle("Downloading ${sourceUrl} -> ${destination}")
    URL url = new URL(sourceUrl)
    url.openConnection().with { conn ->
        connectTimeout = 30000
        readTimeout = 120000
        requestMethod = 'GET'
        inputStream.withCloseable { input ->
            destination.withOutputStream { output ->
                byte[] buffer = new byte[1024 * 1024]
                int n
                while ((n = input.read(buffer)) != -1) output.write(buffer, 0, n)
            }
        }
    }
}

def sha256 = { File file ->
    MessageDigest md = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[1024 * 1024]
        int n
        while ((n = input.read(buffer)) != -1) md.update(buffer, 0, n)
    }
    md.digest().collect { String.format('%02x', it) }.join()
}

def preparePiperAssets = tasks.register('preparePiperAssets') {
    doLast {
        File assetsDir = file('src/main/assets')
        File piperDir = new File(assetsDir, 'piper')
        File espeakDir = new File(assetsDir, 'espeak-ng-data')
        File jniRoot = file('src/main/jniLibs')
        piperDir.mkdirs()
        espeakDir.mkdirs()

        File model = new File(piperDir, 'tr_TR-dfki-medium.onnx')
        File modelJson = new File(piperDir, 'tr_TR-dfki-medium.onnx.json')

        downloadFile(
                'https://huggingface.co/rhasspy/piper-voices/resolve/main/tr/tr_TR/dfki/medium/tr_TR-dfki-medium.onnx?download=true',
                model
        )
        downloadFile(
                'https://huggingface.co/rhasspy/piper-voices/resolve/main/tr/tr_TR/dfki/medium/tr_TR-dfki-medium.onnx.json?download=true',
                modelJson
        )

        String expectedModelSha = '2844717f524ab965d3fe86e60562cbb601d3e456836efcc2196cc3a14112a8fb'
        if (sha256(model) != expectedModelSha) {
            model.delete()
            throw new GradleException('Piper DFKI model SHA-256 mismatch')
        }

        File header = file('src/main/cpp/include/espeak-ng/speak_lib.h')
        downloadFile(
                'https://raw.githubusercontent.com/siva-sub/NekoSpeak/main/app/src/main/cpp/include/espeak-ng/speak_lib.h',
                header
        )

        ['arm64-v8a': '8d6ce6a190c261755189e6303786f1a960783b73',
         'armeabi-v7a': '31cfac0358f22795f324d80b9e1fa15226aa2f66'].each { abi, expectedSha ->
            File so = new File(jniRoot, abi + '/libttsespeak.so')
            downloadFile(
                    'https://raw.githubusercontent.com/siva-sub/NekoSpeak/main/app/src/main/jniLibs/' + abi + '/libttsespeak.so',
                    so
            )
            if (sha256(so) != expectedSha) {
                so.delete()
                throw new GradleException('eSpeak native library SHA-256 mismatch for ' + abi)
            }
        }

        if (!new File(espeakDir, 'voices').exists()) {
            File zip = new File(buildDir, 'nekospeak-source.zip')
            downloadFile('https://codeload.github.com/siva-sub/NekoSpeak/zip/refs/heads/main', zip)

            File extracted = new File(buildDir, 'nekospeak-source')
            delete extracted
            extracted.mkdirs()

            copy {
                from zipTree(zip)
                into extracted
                include '**/app/src/main/assets/espeak-ng-data/**'
            }

            File found = fileTree(extracted).matching {
                include '**/app/src/main/assets/espeak-ng-data/**'
            }.files.find { it.isDirectory() && it.name == 'espeak-ng-data' }

            if (found == null) {
                throw new GradleException('NekoSpeak espeak-ng-data not found in source archive')
            }

            copy {
                from found
                into espeakDir
            }
        }

        new File(espeakDir, '.prepared').text = 'prepared'
    }
}

tasks.named('preBuild').configure { dependsOn preparePiperAssets }
afterEvaluate {
    tasks.matching { it.name.startsWith('externalNativeBuild') }.configureEach {
        dependsOn preparePiperAssets
    }
}
