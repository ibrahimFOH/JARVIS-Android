plugins { id 'com.android.application' }

android {
    namespace 'com.stagepulse.jarvis'
    compileSdk 35
    defaultConfig {
        applicationId 'com.stagepulse.jarvis'
        minSdk 26
        targetSdk 35
        versionCode 241
        versionName '2.4.1-specialist-agents'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('JARVIS_KEYSTORE_PATH')
            if (keystorePath != null && !keystorePath.trim().isEmpty()) {
                storeFile file(keystorePath)
                storePassword System.getenv('JARVIS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('JARVIS_KEY_ALIAS')
                keyPassword System.getenv('JARVIS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}

