plugins { id 'com.android.application' }

android {
    namespace 'com.stagepulse.jarvis'
    compileSdk 35
    defaultConfig {
        applicationId 'com.stagepulse.jarvis'
        minSdk 26
        targetSdk 35
        versionCode 223
        versionName '2.2.3-online-voice'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('JARVIS_KEYSTORE_PATH')
            if (keystorePath != null && !keystorePath.trim().isEmpty()) {
                storeFile file(keystorePath)
                storePassword System.getenv('JARVIS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('JARVIS_KEY_ALIAS')
                keyPassword System.getenv('JARVIS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}

def downloadFile = { String sourceUrl, File destination ->
    if (destination.exists() && destination.length() > 1024) return
    destination.parentFile.mkdirs()
    logger.lifecycle("Downloading ${sourceUrl} -> ${destination}")
    URL url = new URL(sourceUrl)
    url.openConnection().with { conn ->
        connectTimeout = 30000
        readTimeout = 120000
        requestMethod = 'GET'
        inputStream.withCloseable { input ->
            destination.withOutputStream { output ->
                byte[] buffer = new byte[1024 * 1024]
                int n
                while ((n = input.read(buffer)) != -1) output.write(buffer, 0, n)
            }
        }
    }
}

def sha256 = { File file ->
    MessageDigest md = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[1024 * 1024]
        int n
        while ((n = input.read(buffer)) != -1) md.update(buffer, 0, n)
    }
    md.digest().collect { String.format('%02x', it) }.join()
}

